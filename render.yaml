services:
  - type: web
    name: skyline-smart-mode
    env: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt && needle download needle3
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEEDLE_TELEMETRY
        value: "0"
      - key: DO_NOT_TRACK
        value: "1"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:8000,https://skyline-index.vercel.app"
